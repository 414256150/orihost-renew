name: Orihost Browser Renew

# 主力续期流（真浏览器）：
# 纯 HTTP 调 complete 无 Turnstile token 直接 500，必须走浏览器：
# Cookie 免登 → Renew Now → Read Article（新标签读文章）→ 倒计时 → Turnstile → Claim Renewal
on:
  schedule:
    # 每 3 天一次，UTC 10:00 = 北京时间 18:00（7 天有效期，提前续避免删机）
    - cron: '0 10 */3 * *'
  workflow_dispatch:

jobs:
  renew-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install seleniumbase
      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
      - name: Run browser renew (xvfb)
        env:
          ORIHOST_REMEMBER: ${{ secrets.ORIHOST_REMEMBER }}
          ORIHOST_SERVER_IDS: ${{ secrets.ORIHOST_SERVER_IDS }}
          ORIHOST_REMEMBER_1: ${{ secrets.ORIHOST_REMEMBER_1 }}
          ORIHOST_SERVER_IDS_1: ${{ secrets.ORIHOST_SERVER_IDS_1 }}
          ORIHOST_REMEMBER_2: ${{ secrets.ORIHOST_REMEMBER_2 }}
          ORIHOST_SERVER_IDS_2: ${{ secrets.ORIHOST_SERVER_IDS_2 }}
          ORIHOST_REMEMBER_3: ${{ secrets.ORIHOST_REMEMBER_3 }}
          ORIHOST_SERVER_IDS_3: ${{ secrets.ORIHOST_SERVER_IDS_3 }}
          # 兼容旧变量名（完整 Cookie 串）
          ORIHOST_COOKIE: ${{ secrets.ORIHOST_COOKIE }}
          ORIHOST_COOKIE_1: ${{ secrets.ORIHOST_COOKIE_1 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ORIHOST_PROXY: ${{ secrets.ORIHOST_PROXY }}
          ARTICLE_WAIT: '30'
          CLAIM_TIMEOUT: '150'
        run: xvfb-run -a python orihost_browser_renew.py
      - name: 📸 上传失败截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orihost-fail-shots
          path: '*.png'
          if-no-files-found: ignore
