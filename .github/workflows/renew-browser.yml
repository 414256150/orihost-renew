name: Orihost Browser Renew

on:
  schedule:
    # 每 3 天一次，UTC 10:00 = 北京时间 18:00
    - cron: '0 10 */3 * *'
  workflow_dispatch:

jobs:
  renew-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies (xvfb for headed browser)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool scrot

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: ⚙ 设置代理 (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: Run browser renew (xvfb)
        env:
          ORIHOST_REMEMBER: ${{ secrets.ORIHOST_REMEMBER }}
          ORIHOST_SERVER_IDS: ${{ secrets.ORIHOST_SERVER_IDS }}
          ORIHOST_REMEMBER_1: ${{ secrets.ORIHOST_REMEMBER_1 }}
          ORIHOST_SERVER_IDS_1: ${{ secrets.ORIHOST_SERVER_IDS_1 }}
          ORIHOST_REMEMBER_2: ${{ secrets.ORIHOST_REMEMBER_2 }}
          ORIHOST_SERVER_IDS_2: ${{ secrets.ORIHOST_SERVER_IDS_2 }}
          ORIHOST_REMEMBER_3: ${{ secrets.ORIHOST_REMEMBER_3 }}
          ORIHOST_SERVER_IDS_3: ${{ secrets.ORIHOST_SERVER_IDS_3 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          ORIHOST_PROXY: ${{ secrets.ORIHOST_PROXY }}
          GH_ROTATE_TOKEN: ${{ secrets.GH_ROTATE_TOKEN }}
          RENEWAL_MAX: '21'
          MAX_ATTEMPTS: '5'
          CLAIM_TIMEOUT: '600'          # 整个 Claim 阶段总时限：150 → 600s
          TURNSTILE_TOKEN_WAIT: '45'    # 每次点击后等 token：12 → 45s
          TURNSTILE_MAX_ATTEMPTS: '6'   # 轮数 8 → 6（每轮更久，总数不用那么多）
          CLAIM_ENABLE_WAIT: '60'       # 等 Claim 按钮解锁窗口：25 → 60s
        run: |
          echo "IS_PROXY=$IS_PROXY | PROXY_SERVER=$PROXY_SERVER"
          pip install pynacl 2>&1 | tail -1
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python orihost_browser_renew.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orihost-shots-${{ github.run_id }}
          path: '*.png'
          if-no-files-found: ignore
